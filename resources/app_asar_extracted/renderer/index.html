<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI系统多账号管理器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <div class="titlebar-left">
      <img class="titlebar-icon" src="../icon.png" alt="" aria-hidden="true">
      <span class="titlebar-title">AI系统多账号管理器</span>
    </div>
    <div class="titlebar-center">
      <div class="titlebar-tools">
        <button type="button" class="titlebar-tool-btn" id="btnRefreshPage" title="刷新当前页面">刷新</button>
        <button type="button" class="titlebar-tool-btn" id="btnOpenDownloadDir" title="打开下载文件夹">文件夹</button>
        <button type="button" class="titlebar-tool-btn" id="btnDownloadLibrary" title="查看已下载文件">资源库</button>
        <button type="button" class="titlebar-tool-btn" id="btnLoginAssist" title="使用外部浏览器辅助登录">登录</button>
        <button type="button" class="titlebar-tool-btn titlebar-tool-primary hidden" id="btnJimengOriginal" title="扫描当前平台资源">扫描资源</button>
      </div>
      <span class="titlebar-page-title" id="pageTitle">未打开页面</span>
    </div>
    <div class="titlebar-right">
      <button type="button" class="titlebar-shortcut-btn" id="btnDesktopShortcut" title="创建桌面快捷图标" aria-label="创建桌面快捷图标">
        <img src="../icon.png" alt="" aria-hidden="true">
        <span>桌面图标</span>
      </button>
      <button type="button" class="titlebar-tool-btn" id="btnChooseDownloadDir" title="更换图片、视频等下载文件的保存位置">更换下载位置</button>
      <div class="titlebar-controls">
        <button class="titlebar-btn titlebar-btn-minimize" id="btnMinimize">─</button>
        <button class="titlebar-btn titlebar-btn-maximize" id="btnMaximize">□</button>
        <button class="titlebar-btn titlebar-btn-close" id="btnClose">×</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar sidebar-left">
      <div class="sidebar-header">
        <h3>账号</h3>
        <button class="btn-add" id="btnAddAccount">添加</button>
      </div>
      <button type="button" class="account-tools-toggle" id="btnToggleAccountTools">
        <span>管理工具</span>
        <span class="account-tools-toggle-icon">▾</span>
      </button>
      <div class="account-tools-panel" id="accountToolsPanel">
        <div class="account-transfer-actions">
          <button type="button" class="account-transfer-btn" id="btnExportAccounts">导出账号</button>
          <button type="button" class="account-transfer-btn" id="btnImportAccounts">导入账号</button>
        </div>
        <div class="account-bulk-actions">
          <button type="button" class="account-transfer-btn" id="btnOpenFilteredAccounts">批量打开</button>
          <button type="button" class="account-transfer-btn" id="btnRefreshOpenTabs">刷新标签</button>
        </div>
        <div class="account-dialogue-actions">
          <button type="button" class="account-transfer-btn hidden human-verification-btn" id="btnCheckHumanVerification" title="检查项目是否出现人机验证">检查人机验证</button>
          <button type="button" class="account-transfer-btn hidden" id="btnAutoDialogue" title="配置随机或自定义对话发布">自动对话</button>
          <button type="button" class="account-transfer-btn hidden" id="btnAutoDialogueSend" title="设置对话自动发送">对话自动发送</button>
        </div>
        <div class="account-tools">
          <input class="account-search" id="accountSearch" type="search" placeholder="搜索账号、分组或备注">
          <select class="account-group-filter" id="accountGroupFilter">
            <option value="all">全部分组</option>
          </select>
        </div>
      </div>
      <div class="account-filter" id="accountFilter"></div>
      <div class="account-list" id="accountList"></div>
      <div class="account-footer">
        <span id="accountCount">共 0 个账号</span>
      </div>
    </aside>

    <main class="browser-area">
      <div class="tab-bar" id="tabBar" tabindex="0" aria-label="已打开的项目，可横向滚动切换"></div>
      <div class="browser-wrapper" id="browserWrapper">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">●</div>
          <p>选择或添加账号后开始浏览</p>
        </div>
      </div>
      <div class="status-bar" id="statusBar">
        <span class="status-text">就绪</span>
      </div>
    </main>

    <aside class="sidebar sidebar-right">
      <div class="sidebar-header">
        <h3>资源</h3>
        <span class="resource-count" id="resourceCount">共 0 项</span>
      </div>
      <div class="resource-actions">
        <div class="resource-capture-mode" id="resourceCaptureMode">
          <button class="capture-mode-btn active" data-mode="all">全部</button>
          <button class="capture-mode-btn" data-mode="image">图片</button>
          <button class="capture-mode-btn" data-mode="video">视频</button>
        </div>
        <button class="btn btn-primary btn-sm" id="btnDownloadImages">下载图片</button>
        <button class="btn btn-purple btn-sm" id="btnDownloadVideos">下载视频</button>
        <button class="btn btn-ghost btn-sm" id="btnClearResources">清空</button>
        <button class="btn btn-ghost btn-sm" id="btnDiagnostics" style="margin-left:4px;color:var(--primary)">诊断</button>
      </div>
      <div class="resource-list" id="resourceList"></div>
    </aside>

    <div class="modal-overlay hidden" id="diagOverlay">
      <div class="modal" style="width:700px;max-width:90vw;">
        <div class="modal-header">
          <h3>系统诊断</h3>
          <button class="modal-close" id="diagClose">×</button>
        </div>
        <div class="modal-body" style="max-height:60vh;overflow-y:auto;">
          <div id="diagContent">
            <p style="color:#888;">加载中...</p>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" id="diagRefresh">刷新</button>
          <button class="btn btn-ghost" id="diagClose2">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-layer" id="toastLayer"></div>

  <div class="modal-overlay hidden" id="downloadLibraryOverlay">
    <div class="modal download-library-modal">
      <div class="modal-header">
        <div>
          <h3>资源库</h3>
          <p class="download-library-path" id="downloadLibraryPath">读取中...</p>
        </div>
        <button class="modal-close" id="downloadLibraryClose">×</button>
      </div>
      <div class="download-library-toolbar">
        <input class="download-library-search" id="downloadLibrarySearch" type="search" placeholder="搜索文件名">
        <select class="download-library-filter" id="downloadLibraryTypeFilter">
          <option value="all">全部类型</option>
          <option value="image">图片</option>
          <option value="video">视频</option>
          <option value="file">其他文件</option>
        </select>
        <select class="download-library-filter" id="downloadLibraryPlatformFilter">
          <option value="all">全部平台</option>
          <option value="豆包">豆包</option>
          <option value="创作平台">创作平台</option>
          <option value="千问">千问</option>
          <option value="即梦">即梦</option>
          <option value="其他">其他</option>
        </select>
        <button class="btn btn-ghost btn-sm" id="downloadLibraryRefresh">刷新</button>
        <button class="btn btn-ghost btn-sm" id="downloadLibraryOpenFolder">打开文件夹</button>
      </div>
      <div class="download-library-list" id="downloadLibraryList"></div>
      <div class="download-library-empty hidden" id="downloadLibraryEmpty">暂无下载文件</div>
      <div class="download-library-footer" id="downloadLibraryFooter">
        <span id="downloadLibrarySummary">共 0 个文件</span>
        <div class="download-library-pages">
          <button class="btn btn-ghost btn-sm" id="downloadLibraryPrev">上一页</button>
          <span id="downloadLibraryPageInfo">1 / 1</span>
          <button class="btn btn-ghost btn-sm" id="downloadLibraryNext">下一页</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3>添加账号</h3>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">平台选择</label>
          <select class="form-select" id="selectPlatform">
            <option value="">请选择平台</option>
          </select>
        </div>
        <div class="form-group" id="projectCountGroup">
          <label class="form-label">创建项目数量</label>
          <select class="form-select" id="inputProjectCount" aria-label="创建项目数量"></select>
        </div>
        <div class="form-group">
          <label class="form-label">账号名称</label>
          <input class="form-input" id="inputName" type="text" placeholder="可选，留空自动生成">
        </div>
        <div class="form-group">
          <label class="form-label">分组</label>
          <input class="form-input" id="inputGroup" type="text" placeholder="可选，例如：客户A / 视频号 / 备用">
        </div>
        <div class="form-group">
          <label class="form-label">备注</label>
          <input class="form-input" id="inputRemark" type="text" placeholder="可选，方便区分用途">
        </div>
        <div class="form-group hidden" id="customUrlGroup">
          <label class="form-label">网站地址</label>
          <input class="form-input" id="inputCustomUrl" type="url" placeholder="例如：https://example.com">
        </div>
        <p class="form-hint" id="namePreview"></p>
        <p class="form-info">每个账号使用独立的用户数据目录，Cookie 和登录状态完全隔离。</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="modalCancel">取消</button>
        <button class="btn btn-primary" id="modalConfirm">确定添加</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
